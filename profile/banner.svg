  <text x="254" y="252" fill="#b7c9bd" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif" font-size="27">YouTube transcripts, in bulk.</text>

  <!-- a transcript assembling: timestamp chip and line, clear of the text -->
