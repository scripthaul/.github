<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="ScriptHaul: YouTube transcripts, in bulk.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a2d"/>
      <stop offset="1" stop-color="#172f25"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f4ed" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#f2f4ed" stop-opacity="0.14"/>
      <stop offset="0.86" stop-color="#f2f4ed" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f2f4ed" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="0" y="48" width="1280" height="1" fill="url(#rule)"/>
  <rect x="0" y="311" width="1280" height="1" fill="url(#rule)"/>

  <!-- the caption mark, centred on the wordmark's x-height -->
  <rect x="140" y="140" width="80" height="80" fill="#2d5c47"/>
  <rect x="158.75" y="181.25" width="42.5" height="8.75" rx="4.375" fill="#f2f4ed"/>
  <rect x="166.25" y="196.25" width="27.5" height="8.75" rx="4.375" fill="#f2f4ed"/>

