    <rect x="960" y="162" width="30" height="8" rx="3" fill="#8ebba1" fill-opacity="0.55"/><rect x="1000" y="162" width="160" height="8" rx="4" fill="#f2f4ed" fill-opacity="0.14"/>
    <rect x="960" y="190" width="30" height="8" rx="3" fill="#8ebba1" fill-opacity="0.55"/><rect x="1000" y="190" width="80" height="8" rx="4" fill="#f2f4ed" fill-opacity="0.14"/>
    <rect x="960" y="218" width="30" height="8" rx="3" fill="#8ebba1" fill-opacity="0.55"/><rect x="1000" y="218" width="124" height="8" rx="4" fill="#f2f4ed" fill-opacity="0.14"/>
    <rect x="960" y="246" width="30" height="8" rx="3" fill="#8ebba1" fill-opacity="0.55"/><rect x="1000" y="246" width="148" height="8" rx="4" fill="#f2f4ed" fill-opacity="0.14"/>
  </g>
  <text x="1160" y="80" fill="#8ebba1" fill-opacity="0.7" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.5" text-anchor="end">[ 00:04:12 → 00:04:15 ]</text>
  <text x="1160" y="292" fill="#8ebba1" fill-opacity="0.7" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.5" text-anchor="end">[ TXT · SRT · VTT · MD · JSON ]</text>
